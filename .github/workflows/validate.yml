name: Verify MHAK site (no deployment)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and staging release audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run automated tests
        run: npm test
      - name: Audit staging safety and local links
        run: npm run audit
      - name: Build safe staging output
        run: npm run build:staging
      - name: Check deployed output remains staging-only
        run: npm run verify:staging
      - name: Save staging artifact for review (does not deploy)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mhak-staging-preview
          path: release/staging/
          if-no-files-found: error
          retention-days: 7
